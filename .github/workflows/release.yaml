name: Build Theme Package & Release

# 发版方式: 打 tag 触发, tag message 即版本说明。
#   git tag -a v26.08.28 -m "本次改了什么" && git push origin v26.08.28
# 推 main 不再发版 —— 日常提交不该每次都产出一个 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已存在 tag (如 v26.08.28)"
        required: true

permissions:
  contents: write # 创建 Release / 上传 asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # 取全量历史 + tag: 附注 tag 的 message 只存在于 tag 对象里, 浅克隆读不到
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Resolve tag metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # 版本号 = tag 去掉前导 v, 写进 komari-theme.json
          VERSION="${TAG#v}"
          ZIP_NAME="komari-paper-${TAG}.zip"

          echo "TAG=${TAG}"           >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}"   >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"

      - name: Extract tag message as release notes
        run: |
          git fetch --tags --force --quiet || true
          # 附注 tag (-a / -s) 的 message 作为版本说明正文;
          # 轻量 tag 没有 message, %(contents) 会落回空, 此时给出提示而非静默发空说明
          NOTES=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)')
          # 剥掉 GPG 签名块 (签名 tag 的 contents 会带上 -----BEGIN PGP SIGNATURE-----)
          NOTES=$(printf '%s\n' "$NOTES" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          NOTES=$(printf '%s\n' "$NOTES" | sed -e 's/[[:space:]]*$//' )

          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="_该 tag 未附带说明 (轻量 tag)。下次用 \`git tag -a ${TAG} -m \"说明\"\` 打 tag。_"
          fi

          {
            printf '%s\n' "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "**安装**: 下载下方 \`${ZIP_NAME}\`, 在 Komari 后台 → 主题管理上传。"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Inject version into komari-theme.json
        # 只写进构建产物, 不回写仓库 —— tag 已经是版本真值, 不需要再往 main 推 commit
        run: |
          jq --arg version "$VERSION" '.version = $version' \
             komari-theme.json > komari-theme-updated.json
          mv komari-theme-updated.json komari-theme.json
          cat komari-theme.json

      - name: Build project
        run: npm run build

      - name: Verify required files
        run: |
          test -f preview.png       || (echo "preview.png missing" && exit 1)
          test -f komari-theme.json || (echo "komari-theme.json missing" && exit 1)
          test -d dist              || (echo "dist/ missing" && exit 1)

      - name: Assemble theme package
        run: |
          mkdir -p theme-package
          cp preview.png komari-theme.json theme-package/
          cp -r dist theme-package/
          (cd theme-package && zip -r "../${ZIP_NAME}" .)
          ls -la "${ZIP_NAME}"

      - name: Upload artifact (always available)
        uses: actions/upload-artifact@v7
        with:
          name: komari-paper-${{ steps.meta.outputs.tag }}
          path: komari-paper-*.zip
          retention-days: 90

      - name: Create / update Release with asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Komari Paper ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: komari-paper-*.zip
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
